server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  datasource:
    url: jdbc:postgresql://localhost:5433/chat_db?currentSchema=auth_schema
    username: chat_user
    password: chat_password

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_schema
        generate_statistics: true
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    schemas: auth_schema
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8080/apis/ccompat/v7}
        auto.register.schemas: true
        enable.idempotence: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.hibernate.stat: DEBUG

app:
  kafka:
    topics:
      user-events: user-events
    outbox:
      batch-size: 100
      poll-interval: 5000
      max-attempts: 5
  jwt:
    issuer: auth-service
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    key-id: main-2026-08
    private-key: ${JWT_PRIVATE_KEY_PATH:file:./auth-service/keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY_PATH:file:./auth-service/keys/public.pem}
    audiences: auth-service,chat-service,notification-service