server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: auth-service
  datasource:
    url: "jdbc:postgresql://localhost:5433/lms_db?currentSchema=auth_schema&options=-c timezone=UTC"
    username: ${SPRING_DATASOURCE_PASSWORD:user}
    password: ${SPRING_DATASOURCE_USERNAME:password}

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: auth_schema
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    schemas: auth_schema
    locations: classpath:db/migration
    baseline-on-migrate: true

  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics
    endpoint:
      health:
        show-details: never