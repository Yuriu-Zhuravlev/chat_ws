server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: chat-service

  datasource:
    url: jdbc:postgresql://localhost:5433/chat_db?currentSchema=chat_schema
    username: chat_user
    password: chat_password

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: chat_schema
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    schemas: chat_schema
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      acks: all
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8080/apis/ccompat/v7}
        auto.register.schemas: true
        enable.idempotence: true
        max.block.ms: 5000
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      group-id: chat-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      enable-auto-commit: false
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL:http://localhost:8080/apis/ccompat/v7}
        specific.avro.reader: true
    listener:
      ack-mode: record

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

app:
  jwt:
    issuer: ${AUTH_ISSUER:auth-service}
    audience: chat-service
  kafka:
    topics:
      user-events: user-events
      chat-events: chat-events
    outbox:
      scheduling-enabled: true
      batch-size: 100
      poll-interval: 5000
      max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never